<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Offline — Beatix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0D0B2B;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      text-align: center;
    }
    .logo { font-size: 28px; font-weight: 800; color: #F5C842; margin-bottom: 32px; letter-spacing: -0.5px; }
    .logo span { color: #A855D4; }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    p { font-size: 15px; color: rgba(255,255,255,0.5); line-height: 1.6; max-width: 280px; margin-bottom: 32px; }
    button {
      background: #F5C842;
      color: #0D0B2B;
      border: none;
      border-radius: 14px;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="logo">BEA<span>TIX</span></div>
  <div class="icon">📡</div>
  <h1>You are offline</h1>
  <p>Check your internet connection and try again. Your saved tickets are still available in the app.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
